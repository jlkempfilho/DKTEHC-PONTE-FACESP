<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painéis da rede - protótipo</title>
<style>
:root{--bg:#F1F4F8;--card:#FFFFFF;--ink:#132036;--muted:#56637A;--line:#D5DCE6;--brand:#1E5A8C;--bar:#3B7DC4;--ok:#1F6B45;--warn:#B4471B;--soft:#EAF1F8}
@media (prefers-color-scheme: dark){:root{--bg:#0E1626;--card:#16213A;--ink:#EAF0F8;--muted:#A4B1C7;--line:#2B3A5C;--brand:#6FA8DC;--bar:#5C9BE0;--ok:#7BD3A2;--warn:#FFB38A;--soft:#1C2A47}}
[hidden]{display:none!important}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
.wrap{max-width:1150px;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:24px} h2{margin:0 0 4px;font-size:18px} p{margin:4px 0}
nav{display:flex;gap:8px;flex-wrap:wrap}
button{font:600 14px inherit;border:1px solid var(--line);background:var(--card);color:var(--brand);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px}
button.pri,nav button[aria-pressed="true"]{background:var(--brand);color:var(--card)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;overflow-x:auto}
.muted{color:var(--muted);font-size:13px} .erro{color:var(--warn)}
.kpis{display:flex;gap:12px;flex-wrap:wrap} .kpi{border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:150px} .kpi b{display:block;font-size:26px}
.barras{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.barra{display:grid;grid-template-columns:minmax(140px,260px) 1fr 70px;gap:10px;align-items:center;font-size:14px}
.trilho{background:var(--soft);border-radius:6px;height:16px} .enche{background:var(--bar);border-radius:6px;height:16px}
.barra .n{text-align:right;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:14px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600} td.n{text-align:right;font-variant-numeric:tabular-nums}
.selo{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;border:1px solid var(--line)} .selo.lac{border-color:var(--warn);color:var(--warn)}
.colunas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.coluna{border:1px solid var(--line);border-radius:12px;padding:10px} .coluna h3{margin:0 0 8px;font-size:15px}
.cartao{border-top:1px solid var(--line);padding:8px 0;font-size:13px} .cartao select,.cartao input{font:inherit;width:100%;margin-top:4px;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
@media (max-width:600px){.barra{grid-template-columns:1fr 60px}.barra .trilho{grid-column:1/3;order:3}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Painéis da rede de associações</h1>
    <p class="muted">Números agregados, sem identificar lojista. Município com menos de 3 casos aparece como "menos de 3". <span id="aviso-semente"></span></p></header>
  <section id="login">
    <label for="token" class="muted">Chave de acesso</label>
    <input id="token" type="password" autocomplete="off" style="width:100%;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)">
    <p><button id="entrar" class="pri" type="button">Entrar</button> <span id="msg" class="muted"></span></p>
  </section>
  <div id="app" hidden style="display:flex;flex-direction:column;gap:16px">
    <nav>
      <button data-aba="regional" aria-pressed="true">FACESP: demandas por região</button>
      <button data-aba="lacunas" aria-pressed="false">FACESP: lacunas de oferta</button>
      <button data-aba="status" aria-pressed="false">Status e tempos (SLA)</button>
      <button data-aba="fila" aria-pressed="false">Associação: fila por status</button>
      <button data-aba="naosoube" aria-pressed="false">Associação: o que o atendimento não soube</button>
    </nav>
    <div id="conteudo" style="display:flex;flex-direction:column;gap:16px"></div>
  </div>
</div>
<script src="/painel.js"></script>
</body>
</html>
